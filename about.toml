# cargo-about configuration for MacUtl (macOS fork of NeoUtl).
#
# The list below covers every SPDX license identifier that appears in the
# dependency graph for the aarch64-apple-darwin release build. Dual-licensed
# crates are used under the most permissive option:
#   - self_cell: Apache-2.0 (not GPL-2.0-only)
#   - r-efi: MIT (not LGPL-2.1-or-later)
# The full license texts and the selected option for each crate are emitted
# into THIRD_PARTY_NOTICES.md by `scripts/generate_third_party_notices.sh`.
accepted = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-only",
    "GPL-3.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false
